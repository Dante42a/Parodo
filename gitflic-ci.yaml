image: python:3.12-slim

stages:
  - test
  - build

test:
  stage: test
  script:
    # как в GitHub CI (.github/workflows/ci.yml): torch CPU той же версии, что в Dockerfile.api
    - pip install --no-cache-dir torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
    - pip install --no-cache-dir -r requirements-ci.txt ruff
    - ruff check .
    - pytest

docker-config:
  stage: build
  script:
    - python -m compileall src app frontend
    - test -f Dockerfile.api
    - test -f Dockerfile.frontend
    - test -f docker-compose.yml
