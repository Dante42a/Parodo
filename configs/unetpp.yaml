defaults:
  - base

model:
  name: "unetpp"
  encoder_name: "efficientnet-b4"
  encoder_weights: "imagenet"
  in_channels: 3
  classes: 4
  deep_supervision: true

training:
  encoder_lr: 1.0e-4
  decoder_lr: 5.0e-4
  batch_size: 4

data:
  split_dir: "data/splits/bone"  # только bone-размеченные снимки (train/val/test)

# expected VRAM: ~6 GB at batch=4; reduce to batch=2 if OOM
