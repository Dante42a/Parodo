defaults:
  - base

model:
  name: "deeplabv3plus"
  encoder_name: "resnet101"
  encoder_weights: "imagenet"
  in_channels: 3
  classes: 4

training:
  encoder_lr: 1.0e-4
  decoder_lr: 5.0e-4

data:
  num_workers: 0  # network share + Windows = worker crashes

# RTX 4070 12GB — batch=4 at 512x1024 fits comfortably
