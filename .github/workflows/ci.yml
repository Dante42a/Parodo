name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Имена джобов (lint, test, docker) — это required checks в ruleset protect-main. Не переименовывать.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      # CPU-сборка torch (~200 МБ вместо ~2.5 ГБ с CUDA)
      # версии — как в Dockerfile.api: тесты идут на том же torch, что поедет на сервер
      - run: pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-ci.txt
      - run: pytest -v --junitxml=pytest-report.xml
      # Сводка на странице запуска: сколько прошло/упало и что именно — без чтения логов
      - name: Test summary
        if: always()
        run: python scripts/test_summary.py pytest-report.xml >> "$GITHUB_STEP_SUMMARY"

  # Сборка образов + проверка изнутри: успешная сборка ещё не значит, что в образе есть библиотеки инференса.
  # На push в main проверенные образы публикуются в GHCR с тегом = sha коммита — их забирает deploy.yml.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          tags: parodo-api:ci
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          tags: parodo-frontend:ci
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: API image has inference libraries
        run: docker run --rm parodo-api:ci python -c "import torch, segmentation_models_pytorch, ultralytics, src.api.main"
      - name: API image starts and answers /healthz
        run: |
          docker run -d --name api -p 8000:8000 parodo-api:ci
          for _ in $(seq 1 60); do curl -fs http://localhost:8000/healthz && exit 0; sleep 2; done
          docker logs api
          exit 1
      - name: Push images to GHCR (only main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          owner="${GITHUB_REPOSITORY_OWNER,,}"  # имя в GHCR — строчными буквами
          for name in api frontend; do
            image="ghcr.io/$owner/parodo-$name:${{ github.sha }}"
            docker tag "parodo-$name:ci" "$image"
            docker push "$image"
          done
