# Имя проекта закреплено: деплой новых релизов заменяет контейнеры, а не поднимает второй комплект
name: parodo

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      PARODO_MODEL_PATH: /models/semantic.ckpt
      PARODO_YOLO_PATH: /models/yolo.pt
      PARODO_CONFIG: configs/deeplabv3plus.yaml
      PARODO_DEVICE: cpu
      # версия модели вычисляется при загрузке (архитектура + sha256 весов и конфига) — см. /readyz
    volumes:
      - ./checkpoints:/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s  # импорт torch на 1 CPU занимает время; /readyz покажет, когда модель загрузится

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      PARODO_API_URL: http://api:8000
    ports:
      - "80:8501"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
    restart: unless-stopped
